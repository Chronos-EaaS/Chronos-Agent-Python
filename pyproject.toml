[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "chronos-agent"
version = "0.1.0"
description = "Python agent and command runner for the Chronos v1 agent API"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = []

[project.scripts]
chronos-agent = "chronos_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
